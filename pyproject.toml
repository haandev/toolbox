[project]
name = "kutu"
version = "0.1.0"
description = "Modüler kutu sistemi parametrik parçaları"
requires-python = ">=3.10,<3.14"
dependencies = ["build123d>=0.9"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kutu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
